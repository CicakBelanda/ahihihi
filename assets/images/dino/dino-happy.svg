<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" id="dino-happy">
  <!-- Body -->
  <ellipse cx="100" cy="140" rx="45" ry="40" fill="#7BA47E"/>
  <!-- Head -->
  <circle cx="100" cy="80" r="30" fill="#8DBB8F"/>
  <!-- Happy eyes -->
  <path d="M83 78 Q88 72 93 78" fill="none" stroke="#2B2426" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M107 78 Q112 72 117 78" fill="none" stroke="#2B2426" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Big grin -->
  <path d="M90 90 Q100 100 110 90" fill="none" stroke="#2B2426" stroke-width="2" stroke-linecap="round"/>
  <ellipse cx="100" cy="96" rx="6" ry="4" fill="#D95D72"/>
  <!-- Spikes -->
  <polygon points="60,110 68,95 76,110" fill="#5D8A60"/>
  <polygon points="80,105 88,88 96,105" fill="#5D8A60"/>
  <polygon points="104,105 112,88 120,105" fill="#5D8A60"/>
  <polygon points="124,110 132,95 140,110" fill="#5D8A60"/>
  <!-- Both arms up -->
  <ellipse cx="58" cy="120" rx="12" ry="6" fill="#7BA47E" transform="rotate(-45 58 120)"/>
  <ellipse cx="142" cy="120" rx="12" ry="6" fill="#7BA47E" transform="rotate(45 142 120)"/>
</svg>
