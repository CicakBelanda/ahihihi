<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" id="dino-sad">
  <!-- Body -->
  <ellipse cx="100" cy="140" rx="45" ry="40" fill="#7BA47E"/>
  <!-- Head -->
  <circle cx="100" cy="80" r="30" fill="#8DBB8F"/>
  <!-- Eyes (sad) -->
  <ellipse cx="88" cy="78" rx="5" ry="7" fill="#2B2426"/>
  <ellipse cx="112" cy="78" rx="5" ry="7" fill="#2B2426"/>
  <ellipse cx="89" cy="76" rx="2" ry="2" fill="#FFFFFF"/>
  <ellipse cx="113" cy="76" rx="2" ry="2" fill="#FFFFFF"/>
  <!-- Eyebrows (sad angle) -->
  <line x1="83" y1="68" x2="93" y2="71" stroke="#2B2426" stroke-width="2" stroke-linecap="round"/>
  <line x1="117" y1="68" x2="107" y2="71" stroke="#2B2426" stroke-width="2" stroke-linecap="round"/>
  <!-- Tear -->
  <path d="M93 86 Q91 94 95 98" fill="#A8D8EA" stroke="#A8D8EA" stroke-width="3" stroke-linecap="round"/>
  <!-- Mouth -->
  <path d="M93 95 Q100 90 107 95" fill="none" stroke="#2B2426" stroke-width="2" stroke-linecap="round"/>
  <!-- Spikes on back -->
  <polygon points="60,110 68,95 76,110" fill="#5D8A60"/>
  <polygon points="80,105 88,88 96,105" fill="#5D8A60"/>
  <polygon points="104,105 112,88 120,105" fill="#5D8A60"/>
  <polygon points="124,110 132,95 140,110" fill="#5D8A60"/>
  <!-- Short arms -->
  <ellipse cx="60" cy="135" rx="12" ry="6" fill="#7BA47E"/>
  <ellipse cx="140" cy="135" rx="12" ry="6" fill="#7BA47E"/>
</svg>
