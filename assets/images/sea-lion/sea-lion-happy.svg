<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" id="sea-lion-happy">
  <!-- Body -->
  <ellipse cx="100" cy="130" rx="55" ry="40" fill="#6B8E9B"/>
  <!-- Head -->
  <circle cx="100" cy="75" r="32" fill="#8BA9B5"/>
  <!-- Snout -->
  <ellipse cx="100" cy="95" rx="18" ry="12" fill="#A3BFC9"/>
  <!-- Happy eyes -->
  <path d="M83 72 Q88 66 93 72" fill="none" stroke="#2B2426" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M107 72 Q112 66 117 72" fill="none" stroke="#2B2426" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Nose -->
  <ellipse cx="100" cy="90" rx="5" ry="3.5" fill="#2B2426"/>
  <!-- Happy smile -->
  <path d="M90 100 Q100 108 110 100" fill="none" stroke="#2B2426" stroke-width="2" stroke-linecap="round"/>
  <!-- Whiskers -->
  <line x1="75" y1="92" x2="88" y2="95" stroke="#2B2426" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="75" y1="98" x2="88" y2="98" stroke="#2B2426" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="125" y1="92" x2="112" y2="95" stroke="#2B2426" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="125" y1="98" x2="112" y2="98" stroke="#2B2426" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Flippers -->
  <ellipse cx="55" cy="135" rx="15" ry="8" fill="#8BA9B5" transform="rotate(-15 55 135)"/>
  <ellipse cx="145" cy="135" rx="15" ry="8" fill="#8BA9B5" transform="rotate(15 145 135)"/>
  <!-- Tail (wagging up) -->
  <path d="M155 140 Q180 120 170 100 Q165 90 155 85" fill="#8BA9B5" stroke="#8BA9B5" stroke-width="6" stroke-linecap="round"/>
</svg>
